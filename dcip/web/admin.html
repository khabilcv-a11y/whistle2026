<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DCIP Admin</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login hidden">
  <form class="card login-card" id="loginForm">
    <img class="logo-lg" src="logo.png" alt="DCIP Kozhikode">
    <h1>DCIP Application Processing &amp; Management</h1>
    <p class="muted">Sign in with your username and password</p>
    <div class="field"><label class="f" for="luser">Username</label><input type="text" id="luser" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field" style="margin-top:12px"><label class="f" for="lpass">Password</label><input type="password" id="lpass" autocomplete="current-password" required></div>
    <div id="lerr" class="err-box"></div>
    <button class="btn primary" style="width:100%;margin-top:14px" id="lbtn">Sign in</button>
  </form>
</div>

<div id="app" class="hidden">
  <header class="bar">
    <div class="brand"><img class="logo-sm" src="logo.png" alt=""><div><b id="hTitle">DCIP APPLICATION PROCESSING &amp; MANAGEMENT</b><small id="hSub"></small></div></div>
    <div class="grow"></div>
    <span class="live" id="live" title="Data refreshes automatically"><i></i><span id="liveText">Live</span></span>
    <button class="btn small" id="btnRefresh">Refresh</button>
    <a class="btn small" id="btnForm" href="index.html" target="_blank" rel="noopener">Open form ↗</a>
    <span class="who" id="who"></span><button class="btn small" id="btnAccount" title="Change your password">My account</button>
    <button class="btn small" id="btnLogout">Sign out</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view" class="view"></main>
</div>

<aside id="drawer" class="drawer hidden" aria-label="Application details"></aside>
<div id="drawerBg" class="drawer-bg hidden"></div>
<div id="modalWrap" class="modal-wrap hidden"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script src="vendor/exceljs.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="insights.js"></script>
<script src="reports.js"></script>
<script src="admin-core.js"></script>
<script src="admin-reports.js"></script>
<script src="admin-views.js"></script>
<script src="admin-extra.js"></script>
<script src="admin-boot.js"></script>
</body>
</html>
