<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo.png">
<script src="config.js"></script>
<title>WHISTLE 2026 · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050912;
    --panel: rgba(255,255,255,.045);
    --panel2: rgba(255,255,255,.075);
    --line: rgba(255,255,255,.09);
    --txt: #eef2ff;
    --muted: #8a96b8;
    --dim: #4b5675;
    --gold: #f5b82e;
    --silver: #c7d0dd;
    --bronze: #cd8550;
    --live: #22c55e;
    --warn: #f59e0b;
    --bad: #ef4444;
    --cond: "Barlow Condensed", "Arial Narrow", Inter, sans-serif;
  }
  html { font-size: min(1.05vw, 1.9vh); }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden; color: var(--txt);
    font-family: Inter, system-ui, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(80rem 40rem at 8% -12%, #16264d 0%, transparent 60%),
      radial-gradient(70rem 45rem at 110% 115%, #1c1545 0%, transparent 55%),
      repeating-linear-gradient(115deg, transparent 0 6rem, rgba(255,255,255,.012) 6rem 6.2rem),
      var(--bg);
  }
  body.idle { cursor: none; }
  body:not(.idle) #stage { cursor: pointer; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .cond { font-family: var(--cond); }
  .num { font-family: var(--cond); font-variant-numeric: tabular-nums; }

  #app { height: 100vh; display: grid; grid-template-rows: auto auto 1fr auto; }

  /* ---------------- header ---------------- */
  .hdr { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 1.5rem; padding: .9rem 2rem .7rem; }
  .brand { display: flex; align-items: center; gap: 1rem; min-width: 0; }
  .crest { height: 4.6rem; width: auto; flex: none; filter: drop-shadow(0 .3rem .8rem rgba(0,0,0,.45)); }
  .school { min-width: 0; padding-left: 1rem; border-left: 2px solid rgba(255,255,255,.14); }
  .s1 { font-family: var(--cond); font-weight: 800; font-size: 2.35rem; line-height: .95; letter-spacing: .05em; white-space: nowrap; }
  .s2 { font-family: var(--cond); font-weight: 600; font-size: .92rem; letter-spacing: .11em; color: #b9c3de; margin-top: .3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scene-title { text-align: center; }
  .event-line { display: inline-flex; align-items: baseline; gap: .6rem; font-family: var(--cond); letter-spacing: .16em; margin-bottom: .15rem; }
  .event-line b { font-weight: 800; font-size: 1.15rem; color: var(--gold); }
  .event-line span { font-weight: 600; font-size: .95rem; color: var(--muted); }
  .event-line span::before { content: "·"; margin-right: .6rem; color: var(--dim); }
  #sceneName { font-family: var(--cond); font-weight: 700; font-size: 2rem; letter-spacing: .14em; }
  #sceneSub { font-size: .85rem; color: var(--muted); letter-spacing: .18em; text-transform: uppercase; margin-top: .15rem; min-height: 1.1rem; }
  .hdr-right { justify-self: end; text-align: right; }
  #clock { font-family: var(--cond); font-weight: 700; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .status { display: inline-flex; align-items: center; gap: .5rem; font-size: .8rem; font-weight: 700; letter-spacing: .14em; margin-top: .4rem; padding: .25rem .7rem; border-radius: 99rem; background: rgba(34,197,94,.12); color: #86efac; }
  .status i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 rgba(34,197,94,.7); animation: pulse 1.8s infinite; }
  .status.retry { background: rgba(245,158,11,.14); color: #fcd34d; } .status.retry i { background: var(--warn); animation: none; }
  .status.offline { background: rgba(239,68,68,.16); color: #fca5a5; } .status.offline i { background: var(--bad); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.6); } 70% { box-shadow: 0 0 0 .6rem rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .timer { height: .22rem; background: rgba(255,255,255,.05); margin: 0 2rem; border-radius: 1rem; overflow: hidden; }
  .timer i.skip { animation: skipflash .5s ease-out; }
  @keyframes skipflash { from { background: #fff; box-shadow: 0 0 1rem #fff; } }
  .timer i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #60a5fa, #a78bfa); }

  /* ---------------- stage / scenes ---------------- */
  #stage { position: relative; overflow: hidden; }
  .scene { position: absolute; inset: 0; padding: 1.2rem 2rem 1rem; opacity: 0; visibility: hidden; transform: translateY(1rem); transition: opacity .7s ease, transform .7s ease, visibility 0s .7s; display: flex; flex-direction: column; gap: 1.1rem; overflow: hidden; }
  .scene.on { opacity: 1; visibility: visible; transform: none; transition: opacity .7s ease, transform .7s ease, visibility 0s; }
  .scene.anim .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(1.2rem); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 1.1rem; }
  .ptitle { font-family: var(--cond); font-weight: 700; letter-spacing: .14em; font-size: 1.15rem; color: var(--muted); text-transform: uppercase; }
  .empty-big { margin: auto; text-align: center; color: var(--muted); font-family: var(--cond); font-size: 2.4rem; letter-spacing: .1em; }
  .empty-big small { display: block; font-family: Inter; font-size: 1rem; letter-spacing: .05em; margin-top: .6rem; }

  .md { display: inline-grid; place-items: center; width: 1.35em; height: 1.35em; border-radius: 50%; font-style: normal; font-family: var(--cond); font-weight: 800; font-size: .8em; color: #111; background: #64748b; flex: none; }
  .md.m1 { background: linear-gradient(135deg, #ffe08a, var(--gold)); }
  .md.m2 { background: linear-gradient(135deg, #f1f5f9, var(--silver)); }
  .md.m3 { background: linear-gradient(135deg, #f2b98b, var(--bronze)); }
  .md.m0 { color: #fff; }

  /* ---------------- MAIN: totals ---------------- */
  .m-totals { display: grid; gap: 1rem; flex: none; }
  .tile { position: relative; overflow: hidden; border-radius: 1.1rem; padding: .9rem 1.3rem .8rem; color: var(--i); background: linear-gradient(150deg, var(--c) 0%, var(--c2) 100%); box-shadow: 0 .6rem 2rem -1rem var(--c); transition: transform .4s; }
  .tile::after { content: ""; position: absolute; right: -3rem; top: -3rem; width: 10rem; height: 10rem; border-radius: 50%; background: rgba(255,255,255,.12); }
  .tile.lead { outline: .2rem solid rgba(255,255,255,.85); outline-offset: .2rem; }
  .tile.bump { animation: bump 1.6s ease; }
  @keyframes bump { 0%,100% { transform: none; } 20% { transform: scale(1.04); filter: brightness(1.25); } }
  .t-top { display: flex; align-items: center; gap: .7rem; position: relative; z-index: 1; }
  .t-rank { font-family: var(--cond); font-weight: 800; font-size: 1.15rem; background: rgba(0,0,0,.25); color: #fff; border-radius: .5rem; padding: .1rem .55rem; letter-spacing: .04em; }
  .t-name { font-family: var(--cond); font-weight: 800; font-size: 1.9rem; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-crown { margin-left: auto; font-size: .7rem; font-weight: 800; letter-spacing: .16em; background: rgba(255,255,255,.9); color: #111; padding: .2rem .55rem; border-radius: 99rem; }
  .t-pts { font-family: var(--cond); font-weight: 800; font-size: 6rem; line-height: .95; letter-spacing: -.01em; font-variant-numeric: tabular-nums; position: relative; z-index: 1; margin: .1rem 0 .15rem; }
  .t-bot { display: flex; align-items: center; justify-content: space-between; gap: .6rem; font-weight: 700; font-size: 1rem; position: relative; z-index: 1; }
  .t-med { display: flex; align-items: center; gap: .3rem; font-family: var(--cond); font-size: 1.25rem; }
  .t-med .md { margin-left: .4rem; font-size: .95rem; } .t-med .md:first-child { margin-left: 0; }
  .t-gap { font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; opacity: .9; white-space: nowrap; }

  /* ---------------- MAIN: matrix ---------------- */
  .m-board { flex: 1; min-height: 0; display: grid; gap: 1rem; align-items: start; }
  .m-board.fade { animation: fadein .7s ease both; }
  @keyframes fadein { from { opacity: 0; transform: translateX(1.5rem); } }
  .mcard { padding: .5rem .7rem; }
  .mc-h { height: 2.4rem; display: flex; align-items: center; gap: .7rem; padding: 0 .3rem; }
  .mc-name { font-family: var(--cond); font-weight: 800; font-size: 1.55rem; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mc-part { font-size: .75rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: .4rem; padding: .05rem .4rem; }
  .mc-prog { margin-left: auto; font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .08em; white-space: nowrap; }
  .mx { width: 100%; border-collapse: separate; border-spacing: 0 0; table-layout: fixed; }
  .mx th { height: 1.9rem; font-size: .75rem; letter-spacing: .12em; color: var(--muted); font-weight: 700; text-align: left; padding: 0 .5rem; }
  .mx th.h { text-align: center; padding: 0 .15rem; }
  .hh { display: block; border-bottom: .22rem solid var(--c); padding-bottom: .15rem; color: var(--txt); font-family: var(--cond); font-size: 1rem; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mx td { height: 2.05rem; padding: 0 .5rem; border-top: 1px solid var(--line); font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mx td.ev { font-weight: 600; font-size: 1rem; letter-spacing: -.01em; }
  .mx td.c { text-align: center; font-family: var(--cond); font-weight: 800; font-size: 1.35rem; padding: 0 .15rem; }
  .mx td.c span { display: inline-block; min-width: 2.6rem; border-radius: .45rem; padding: 0 .3rem; line-height: 1.6rem; }
  .mx td.z { color: var(--dim); font-weight: 600; }
  .mx tr.pend td.ev { color: var(--dim); font-weight: 500; }
  .mx tr.pend td.c { color: #2c3450; }
  .mx tr.tot td { height: 2.2rem; border-top: 2px solid rgba(255,255,255,.2); font-weight: 800; }
  .mx tr.tot td.ev { font-size: .75rem; letter-spacing: .14em; color: var(--muted); }
  .mx tr.tot td.c { font-size: 1.45rem; }
  .m-foot { flex: none; display: flex; align-items: center; justify-content: center; gap: .5rem; height: 1rem; }
  .m-foot i { width: .5rem; height: .5rem; border-radius: 50%; background: rgba(255,255,255,.15); transition: all .3s; }
  .m-foot i.on { width: 1.6rem; border-radius: 1rem; background: #fff; }

  /* ---------------- LATEST ---------------- */
  .lt { flex: 1; display: grid; grid-template-columns: 1fr 22rem; gap: 1.5rem; min-height: 0; }
  .lt-main { display: flex; flex-direction: column; padding: 1.4rem 2rem 0; position: relative; overflow: hidden; }
  .lt-label { display: inline-flex; align-items: center; gap: .6rem; font-weight: 800; letter-spacing: .3em; font-size: .95rem; color: var(--gold); }
  .lt-label::before { content: ""; width: 2rem; height: .2rem; background: var(--gold); }
  .lt-title { font-family: var(--cond); font-weight: 800; font-size: 4.6rem; line-height: 1; letter-spacing: .03em; text-transform: uppercase; margin: .3rem 0 0; }
  .lt-title span { color: var(--muted); }
  .lt-time { color: var(--muted); font-size: 1rem; margin-top: .4rem; }
  .podium { flex: 1; display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 1.2rem; align-items: end; margin-top: 1rem; min-height: 0; }
  .pod { display: flex; flex-direction: column; gap: .6rem; justify-content: flex-end; height: 100%; }
  .pod-h { border-radius: .9rem; padding: .7rem 1rem; background: linear-gradient(150deg, var(--c), var(--c2)); color: var(--i); display: flex; align-items: baseline; justify-content: space-between; gap: .8rem; box-shadow: 0 .6rem 2rem -1rem var(--c); }
  .pod-h b { font-family: var(--cond); font-size: 2.3rem; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pod-h span { font-family: var(--cond); font-weight: 800; font-size: 2.6rem; }
  .pod.p1 .pod-h b { font-size: 2.8rem; } .pod.p1 .pod-h span { font-size: 3.2rem; }
  .pod-none { text-align: center; color: var(--dim); font-family: var(--cond); font-size: 1.6rem; }
  .pod-base { border-radius: .8rem .8rem 0 0; display: grid; place-items: center; font-family: var(--cond); font-weight: 800; font-size: 4rem; color: rgba(0,0,0,.55); }
  .pod.p1 .pod-base { height: 11rem; background: linear-gradient(180deg, #ffe08a, #c98d12); font-size: 5.2rem; }
  .pod.p2 .pod-base { height: 8rem; background: linear-gradient(180deg, #f1f5f9, #8c99ab); }
  .pod.p3 .pod-base { height: 6rem; background: linear-gradient(180deg, #f2b98b, #9a5a2c); }
  .lt-extra { display: flex; gap: .8rem; flex-wrap: wrap; margin: .8rem 0 1rem; }
  .flash-banner { display: none; }
  .scene.flash .flash-banner { display: block; position: absolute; top: 1.2rem; right: 1.6rem; font-family: var(--cond); font-weight: 800; font-size: 1.6rem; letter-spacing: .2em; background: var(--gold); color: #111; padding: .3rem 1rem; border-radius: .5rem; animation: blink 1s steps(2) infinite; }
  .scene.flash .lt-main { box-shadow: 0 0 0 .2rem var(--gold), 0 0 4rem -1rem var(--gold); }
  @keyframes blink { 50% { opacity: .35; } }
  .mini { padding: 1.2rem 1.3rem; display: flex; flex-direction: column; gap: .7rem; }
  .mini-row { display: grid; grid-template-columns: 2rem .4rem 1fr auto; align-items: center; gap: .7rem; }
  .mini-row .r { font-family: var(--cond); font-weight: 800; font-size: 1.5rem; color: var(--muted); }
  .mini-row .bar { width: .4rem; height: 2.2rem; border-radius: 1rem; background: var(--c); }
  .mini-row .n { font-family: var(--cond); font-weight: 700; font-size: 1.7rem; letter-spacing: .06em; text-transform: uppercase; }
  .mini-row .p { font-family: var(--cond); font-weight: 800; font-size: 2.2rem; }

  .ec { display: inline-flex; align-items: center; gap: .45rem; border-radius: .6rem; padding: .25rem .7rem .25rem .35rem; background: var(--c); color: var(--i); font-family: var(--cond); font-weight: 800; font-size: 1.25rem; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
  .ec b { font-weight: 800; opacity: .85; }

  /* ---------------- RECENT ---------------- */
  .rc { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: min-content; gap: .8rem 1.2rem; align-content: start; }
  .rc-row { display: grid; grid-template-columns: 4.8rem 1fr; gap: .2rem 1rem; padding: .8rem 1.1rem; align-items: center; }
  .rc-time { grid-row: span 2; font-family: var(--cond); font-weight: 700; font-size: 1.4rem; color: var(--muted); }
  .rc-ev { font-family: var(--cond); font-weight: 800; font-size: 1.7rem; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc-ev span { color: var(--muted); font-weight: 600; font-size: 1.2rem; letter-spacing: .1em; margin-right: .6rem; }
  .rc-ent { display: flex; gap: .5rem; flex-wrap: wrap; }
  .rc-row.first { background: linear-gradient(90deg, rgba(245,184,46,.16), var(--panel)); border-color: rgba(245,184,46,.4); }

  /* ---------------- tables (sections / medals) ---------------- */
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { font-size: .85rem; letter-spacing: .14em; color: var(--muted); font-weight: 700; padding: .6rem 1rem; text-align: center; text-transform: uppercase; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl td { padding: .55rem 1rem; border-top: 1px solid var(--line); text-align: center; font-family: var(--cond); font-weight: 700; font-size: 2rem; font-variant-numeric: tabular-nums; }
  .tbl td.lab { font-size: 1.7rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; }
  .tbl td.lab small { display: block; font-family: Inter; font-size: .8rem; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .tbl td .cell { display: inline-block; min-width: 4.5rem; padding: .1rem .6rem; border-radius: .6rem; }
  .tbl tfoot td { border-top: 2px solid rgba(255,255,255,.25); font-size: 2.4rem; font-weight: 800; }
  .stack { display: flex; height: 1rem; border-radius: 1rem; overflow: hidden; background: rgba(255,255,255,.06); min-width: 14rem; }
  .stack i { display: block; height: 100%; background: var(--c); }
  .hth { display: inline-block; border-bottom: .25rem solid var(--c); padding-bottom: .2rem; color: var(--txt); font-family: var(--cond); font-size: 1.3rem; }

  /* ---------------- PERFORMANCE ---------------- */
  .perf { flex: 1; display: grid; gap: 1.2rem; min-height: 0; }
  .pf { display: flex; flex-direction: column; overflow: hidden; }
  .pf-h { padding: 1rem 1.3rem; background: linear-gradient(150deg, var(--c), var(--c2)); color: var(--i); display: flex; align-items: center; justify-content: space-between; }
  .pf-h b { font-family: var(--cond); font-size: 2.2rem; letter-spacing: .08em; text-transform: uppercase; }
  .pf-h span { font-family: var(--cond); font-weight: 800; font-size: 1.4rem; background: rgba(0,0,0,.25); color: #fff; padding: .1rem .6rem; border-radius: .5rem; }
  .pf-pts { padding: 1rem 1.3rem .2rem; font-family: var(--cond); font-weight: 800; font-size: 5rem; line-height: 1; }
  .pf-pts small { font-size: 1.2rem; color: var(--muted); letter-spacing: .14em; margin-left: .4rem; }
  .pf-stats { padding: .8rem 1.3rem 1.3rem; display: flex; flex-direction: column; gap: .85rem; }
  .st-row { display: grid; grid-template-columns: 7.5rem 1fr 3rem; align-items: center; gap: .8rem; }
  .st-row .l { font-size: .85rem; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .st-row .v { font-family: var(--cond); font-weight: 800; font-size: 1.7rem; text-align: right; }
  .track { height: .8rem; border-radius: 1rem; background: rgba(255,255,255,.07); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 1rem; background: var(--c); transition: width 1s ease; }

  /* ---------------- PROGRESS ---------------- */
  .pg { flex: 1; display: grid; grid-template-columns: 30rem 1fr; gap: 1.5rem; min-height: 0; }
  .pg-left { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem; padding: 1.5rem; }
  .ring { position: relative; width: 20rem; height: 20rem; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .pct { font-family: var(--cond); font-weight: 800; font-size: 5.5rem; line-height: 1; }
  .ring .lbl { color: var(--muted); letter-spacing: .2em; font-weight: 700; font-size: .85rem; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; width: 100%; }
  .kpi { background: var(--panel2); border-radius: .9rem; padding: .7rem .9rem; text-align: center; }
  .kpi b { display: block; font-family: var(--cond); font-weight: 800; font-size: 2.8rem; line-height: 1.05; }
  .kpi span { font-size: .75rem; letter-spacing: .16em; color: var(--muted); font-weight: 700; }
  .pg-right { padding: 1.4rem 1.8rem; display: flex; flex-direction: column; gap: 1.1rem; justify-content: center; }
  .sp-row { display: grid; grid-template-columns: 13rem 1fr 11rem; gap: 1.2rem; align-items: center; }
  .sp-row .n { font-family: var(--cond); font-weight: 800; font-size: 1.9rem; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-row .track { height: 1.3rem; }
  .sp-row .track i { background: linear-gradient(90deg, #60a5fa, #a78bfa); }
  .sp-row.done .track i { background: linear-gradient(90deg, #22c55e, #86efac); }
  .sp-row .v { font-family: var(--cond); font-weight: 800; font-size: 1.7rem; text-align: right; white-space: nowrap; }
  .sp-row .v small { font-size: 1.1rem; color: var(--muted); margin-left: .5rem; letter-spacing: .1em; }
  .sp-row.done .v small { color: #86efac; }

  /* ---------------- PARTICIPATION ---------------- */
  .pt { flex: 1; display: grid; grid-template-rows: auto 1fr; gap: 1.1rem; min-height: 0; }
  .pt-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
  .pt-kpis .kpi { background: var(--panel); border: 1px solid var(--line); padding: 1rem; }
  .pt-kpis .kpi b { font-size: 3.6rem; }
  .pt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; min-height: 0; }
  .pt-card { padding: 1.1rem 1.3rem; display: flex; flex-direction: column; gap: .7rem; overflow: hidden; }
  .hb-row { display: grid; grid-template-columns: 8.5rem 1fr 3.8rem; gap: .8rem; align-items: center; }
  .hb-row .l { font-family: var(--cond); font-weight: 700; font-size: 1.3rem; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hb-row .v { font-family: var(--cond); font-weight: 800; font-size: 1.4rem; text-align: right; }
  .hb-row .track { height: 1rem; }
  .cols { flex: 1; display: flex; align-items: flex-end; gap: .5rem; min-height: 8rem; }
  .cols .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .3rem; height: 100%; min-width: 0; }
  .cols .col i { display: block; width: 100%; border-radius: .4rem .4rem 0 0; background: linear-gradient(180deg, #a78bfa, #60a5fa); min-height: .2rem; }
  .cols .col b { font-family: var(--cond); font-size: 1.1rem; }
  .cols .col span { font-size: .75rem; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .te-row { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: .7rem; align-items: center; font-size: 1.05rem; }
  .te-row .i { font-family: var(--cond); font-weight: 800; color: var(--muted); font-size: 1.2rem; }
  .te-row .e { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .te-row .e span { color: var(--muted); font-weight: 500; font-size: .85rem; margin-right: .4rem; }
  .te-row .c { font-family: var(--cond); font-weight: 800; font-size: 1.4rem; }

  /* ---------------- RACE ---------------- */
  .race { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.2rem; padding: 1.2rem 2rem; }
  .rr { display: grid; grid-template-columns: 4rem 13rem 1fr 11rem; gap: 1.2rem; align-items: center; }
  .rr .rk { font-family: var(--cond); font-weight: 800; font-size: 3rem; color: var(--muted); text-align: center; }
  .rr .nm { font-family: var(--cond); font-weight: 800; font-size: 2.6rem; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rr .lane { height: 4.4rem; border-radius: .8rem; background: rgba(255,255,255,.05); position: relative; overflow: hidden; }
  .rr .lane i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: .8rem; background: linear-gradient(90deg, var(--c2), var(--c)); display: flex; align-items: center; justify-content: flex-end; padding-right: 1rem; color: var(--i); font-family: var(--cond); font-weight: 800; font-size: 2.6rem; min-width: 5.5rem; transition: width 1.4s cubic-bezier(.2,.8,.2,1); }
  .scene.anim .rr .lane i { animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { width: 0 !important; } }
  .rr .gap { font-family: var(--cond); font-weight: 700; font-size: 1.8rem; color: var(--muted); }
  .rr .gap.lead { color: var(--gold); }
  .race-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: .8rem; }
  .race-kpis .kpi { background: var(--panel); border: 1px solid var(--line); }
  .note-line { text-align: center; color: var(--dim); font-size: .8rem; letter-spacing: .1em; }

  /* ---------------- ticker ---------------- */
  .ticker { display: flex; align-items: stretch; height: 3.2rem; background: rgba(0,0,0,.45); border-top: 1px solid var(--line); }
  .tk-label { flex: none; display: flex; align-items: center; padding: 0 1.4rem; background: var(--gold); color: #111; font-family: var(--cond); font-weight: 800; font-size: 1.3rem; letter-spacing: .2em; }
  .tk-track { flex: 1; overflow: hidden; position: relative; mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent); }
  .tk-inner { position: absolute; top: 0; bottom: 0; left: 0; display: flex; align-items: center; white-space: nowrap; will-change: transform; animation: tick linear infinite; }
  .tk-item { display: inline-flex; align-items: center; gap: .6rem; padding: 0 2.2rem 0 0; font-size: 1.1rem; }
  .tk-item > b { font-family: var(--cond); font-weight: 800; font-size: 1.35rem; letter-spacing: .06em; text-transform: uppercase; }
  .tk-item .ec { font-size: 1.05rem; padding: .1rem .55rem .1rem .25rem; }
  .tk-sep { color: var(--dim); padding-right: 2.2rem; }
  @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .tk-prog { flex: none; display: flex; align-items: center; gap: .8rem; padding: 0 1.6rem; font-family: var(--cond); font-weight: 700; font-size: 1.25rem; letter-spacing: .1em; color: var(--muted); }
  .tk-prog b { color: var(--txt); }
  .tk-prog .mini-track { width: 7rem; height: .5rem; border-radius: 1rem; background: rgba(255,255,255,.1); overflow: hidden; }
  .tk-prog .mini-track i { display: block; height: 100%; background: linear-gradient(90deg, #22c55e, #86efac); }

  /* ---------------- narrow screens (phones / portrait) ---------------- */
  @media (max-width: 820px), (max-aspect-ratio: 4/5) {
    html { font-size: 11px; }
    body { overflow: auto; height: auto; }
    #app { height: auto; min-height: 100vh; }
    .hdr { grid-template-columns: 1fr auto; padding: .8rem 1rem; }
    .scene-title { grid-column: 1 / -1; grid-row: 2; }
    .s1 { font-size: 2rem; }
    .s2 { white-space: normal; }
    .timer { margin: 0 1rem; }
    #stage { min-height: calc(100vh - 12rem); }
    .scene { padding: 1rem; overflow: auto; }
    .m-totals { grid-template-columns: repeat(2, 1fr) !important; }
    .m-board { flex: none; }
    .t-pts { font-size: 4.5rem; }
    .lt, .pg { grid-template-columns: 1fr; }
    .rc { grid-template-columns: 1fr; }
    .perf { grid-template-columns: repeat(2, 1fr) !important; }
    .pt-kpis { grid-template-columns: repeat(2, 1fr); }
    .pt-grid { grid-template-columns: 1fr; }
    .rr { grid-template-columns: 2.5rem 7rem 1fr 6rem; }
    .race-kpis { grid-template-columns: repeat(2, 1fr); }
    .sp-row { grid-template-columns: 8rem 1fr 7rem; }
    .stack { min-width: 6rem; }
    .tk-prog { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="brand">
      <img class="crest" src="logo.png" alt="Calicut Girls' V&amp;HSS crest">
      <div class="school">
        <div class="s1">CALICUT GIRLS</div>
        <div class="s2">VOCATIONAL &amp; HIGHER SECONDARY SCHOOL</div>
      </div>
    </div>
    <div class="scene-title">
      <div class="event-line"><b id="title">WHISTLE 2026</b><span id="subtitle">ANNUAL SPORTS MEET</span></div>
      <div id="sceneName">LOADING…</div><div id="sceneSub"></div>
    </div>
    <div class="hdr-right">
      <div id="clock">--:--:--</div>
      <div class="status retry" id="status"><i></i><span id="statusText">CONNECTING</span></div>
    </div>
  </header>
  <div class="timer"><i id="timerBar"></i></div>

  <main id="stage">
    <section class="scene" id="sc-main"></section>
    <section class="scene" id="sc-latest"></section>
    <section class="scene" id="sc-recent"></section>
    <section class="scene" id="sc-sections"></section>
    <section class="scene" id="sc-performance"></section>
    <section class="scene" id="sc-medals"></section>
    <section class="scene" id="sc-progress"></section>
    <section class="scene" id="sc-participation"></section>
    <section class="scene" id="sc-race"></section>
  </main>

  <footer class="ticker">
    <div class="tk-label">LIVE</div>
    <div class="tk-track"><div class="tk-inner" id="tkInner"></div></div>
    <div class="tk-prog" id="tkProg"></div>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* ======================================================================
   *  Configuration
   * ==================================================================== */
  var CFG = {
    REFRESH_MS: 15000,          // poll interval
    FETCH_TIMEOUT_MS: 30000,    // treat a hung request as failed
    STALE_MS: 90000,            // show OFFLINE if no good data for this long
    PAGE_MS: 10000,             // section-card page flip on the main scoreboard
    MIN_MAIN_MS: 20000,         // main scoreboard minimum dwell time
    SCENE_MS: 13000,            // other screens
    FLASH_MS: 15000,            // "new result" takeover
    FLASH_WINDOW_MS: 15 * 60 * 1000, // only announce results declared within this window
    TICKER_PX_PER_S: 90,
    // Main scoreboard appears between every couple of screens.
    ROTATION: ['main', 'latest', 'sections', 'main', 'race', 'medals', 'main', 'recent', 'progress', 'main', 'performance', 'participation']
  };
  var NAMES = {
    main: 'CHAMPIONSHIP SCOREBOARD', latest: 'LATEST RESULT', recent: 'LIVE UPDATES',
    sections: 'SECTION CHAMPIONSHIP', performance: 'HOUSE PERFORMANCE', medals: 'POSITION TABLE',
    progress: 'EVENT PROGRESS', participation: 'PARTICIPATION', race: 'CHAMPIONSHIP RACE'
  };
  var LS_KEY = 'whistle_dash_cache_v1';

  /* ======================================================================
   *  State
   * ==================================================================== */
  var D = null;                 // current dashboard payload
  var cur = '';                 // current scene id
  var rot = -1;                 // rotation index
  var paused = false;
  var T = { scene: 0, page: 0 };
  var M = { pages: [], page: 0 };
  var PREV = {};                // previous numbers for count-up animations
  var lastOk = 0, fails = 0, booted = false;

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ord(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function fmt(n) { n = Math.round((Number(n) || 0) * 100) / 100; return String(n); }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
  function rgb(hex) { var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [100, 116, 139]; }
  function rgba(hex, a) { var c = rgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function shade(hex, pct) { var c = rgb(hex).map(function (v) { return Math.max(0, Math.min(255, Math.round(v * (1 + pct / 100)))); }); return 'rgb(' + c.join(',') + ')'; }
  function hvars(h) { return '--c:' + h.color + ';--c2:' + shade(h.color, -35) + ';--i:' + h.ink; }
  function house(name) { return (D.houses || []).filter(function (h) { return h.name === name; })[0] || { name: name, color: '#64748b', ink: '#fff' }; }
  function standing(name) { return (D.standings || []).filter(function (s) { return s.house === name; })[0] || { points: 0, rank: 0, first: 0, second: 0, third: 0, other: 0, eventsScored: 0, gapToLeader: 0 }; }
  function md(p) { return '<i class="md m' + (p <= 3 ? p : 0) + '">' + p + '</i>'; }
  function ec(e) { var h = house(e.house); return '<span class="ec" style="' + hvars(h) + '">' + md(e.position) + esc(h.name) + ' <b>+' + fmt(e.points) + '</b></span>'; }
  function hm(ms) { return ms ? new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''; }
  function awarded() { return D && D.race ? D.race.awarded : 0; }

  /* ======================================================================
   *  Data
   * ==================================================================== */
  function fetchData() {
    return new Promise(function (resolve, reject) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; reject(new Error('timeout')); } }, CFG.FETCH_TIMEOUT_MS);
      var ok = function (v) { if (!done) { done = true; clearTimeout(t); resolve(v); } };
      var fail = function (e) { if (!done) { done = true; clearTimeout(t); reject(e); } };
      try {
        if (window.google && google.script && google.script.run) {   // local preview harness
          google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getDashboardData();
          return;
        }
        var url = window.WHISTLE_CONFIG && window.WHISTLE_CONFIG.apiUrl;
        if (!/^https:\/\//.test(url || '')) throw new Error('API URL missing – set apiUrl in config.js');
        fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 'api=dashboard&t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
          .then(ok, fail);
      } catch (e) { fail(e); }
    });
  }

  function poll() {
    fetchData().then(function (json) {
      var d = typeof json === 'string' ? JSON.parse(json) : json;
      if (!d || !d.houses) throw new Error('bad payload');
      fails = 0; lastOk = Date.now();
      try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) {}
      onData(d, false);
    }).catch(function (e) {
      fails++;
      if (window.console) console.warn('Dashboard refresh failed:', e && e.message || e);
    }).then(function () {
      updateStatus();
      var wait = fails ? Math.min(30000, 4000 * Math.pow(2, Math.min(fails, 3))) : CFG.REFRESH_MS;
      setTimeout(poll, wait);
    });
  }

  function onData(d, fromCache) {
    var prev = D;
    D = d;
    $('title').textContent = d.meta.title || 'WHISTLE 2026';
    $('subtitle').textContent = d.meta.subtitle || '';
    safe(renderTicker);

    if (!booted) { booted = true; next(); return; }

    var L = d.latest;
    var isNew = !fromCache && L && (!prev || !prev.latest || (L.sig !== prev.latest.sig && L.ts > prev.latest.ts)) &&
      (d.meta.generatedAt - L.ts) < CFG.FLASH_WINDOW_MS;
    if (isNew) { flashLatest(); return; }

    if (!available(cur)) { next(); return; }
    safe(function () { render(cur, false); });
  }

  function updateStatus() {
    var el = $('status'), tx = $('statusText');
    var age = lastOk ? Date.now() - lastOk : Infinity;
    if (lastOk && age < CFG.STALE_MS && fails === 0) { el.className = 'status'; tx.textContent = 'LIVE · ' + hm(lastOk); }
    else if (lastOk && age < CFG.STALE_MS) { el.className = 'status retry'; tx.textContent = 'RECONNECTING'; }
    else if (D) { el.className = 'status offline'; tx.textContent = 'OFFLINE · DATA ' + (lastOk ? hm(lastOk) : 'CACHED'); }
    else { el.className = 'status retry'; tx.textContent = 'CONNECTING'; }
  }

  /* ======================================================================
   *  Scene scheduler
   * ==================================================================== */
  function available(id) {
    if (!D) return false;
    var any = awarded() > 0 || (D.progress && D.progress.declared > 0);
    switch (id) {
      case 'main': return true;
      case 'latest': case 'recent': return !!D.latest;
      case 'sections': return D.sections.length > 1 && any;
      case 'race': case 'medals': case 'performance': return any;
      case 'progress': return D.progress.total > 0;
      case 'participation': return D.participation && D.participation.athletes > 0;
    }
    return false;
  }

  function next() {
    for (var i = 0; i < CFG.ROTATION.length; i++) {
      rot = (rot + 1) % CFG.ROTATION.length;
      var id = CFG.ROTATION[rot];
      if (available(id) && !(id === cur && id !== 'main')) return show(id);
    }
    show('main');
  }

  function show(id, dur, flash) {
    clearTimeout(T.scene); clearInterval(T.page);
    var prevId = cur;
    cur = id;
    Array.prototype.forEach.call(document.querySelectorAll('.scene'), function (s) {
      var on = s.id === 'sc-' + id;
      s.classList.toggle('on', on);
      if (on) { s.classList.add('anim'); s.classList.toggle('flash', !!flash); }
      else s.classList.remove('anim', 'flash');
    });
    if (prevId !== 'main' || id !== 'main') M.page = 0;
    $('sceneName').textContent = flash ? 'NEW RESULT' : NAMES[id];
    $('sceneSub').textContent = '';
    safe(function () { render(id, true); });

    if (!dur) dur = id === 'main' ? Math.max(CFG.MIN_MAIN_MS, M.pages.length * CFG.PAGE_MS) : CFG.SCENE_MS;
    if (id === 'main' && M.pages.length > 1) {
      T.page = setInterval(function () { M.page = (M.page + 1) % M.pages.length; drawPage(true); }, CFG.PAGE_MS);
    }
    var bar = $('timerBar');
    bar.style.transition = 'none'; bar.style.width = '0';
    void bar.offsetWidth;
    bar.style.transition = 'width ' + dur + 'ms linear'; bar.style.width = '100%';
    T.deadline = paused ? 0 : Date.now() + dur;
    if (!paused) T.scene = setTimeout(next, dur);
    setTimeout(function () { var s = $('sc-' + id); if (s && cur === id) s.classList.remove('anim'); }, 1600);
  }

  function flashLatest() {
    rot = -1; // after the takeover, return to the main scoreboard
    show('latest', CFG.FLASH_MS, true);
  }

  function render(id, entering) {
    var fn = { main: renderMain, latest: renderLatest, recent: renderRecent, sections: renderSections, performance: renderPerformance,
      medals: renderMedals, progress: renderProgress, participation: renderParticipation, race: renderRace }[id];
    fn($('sc-' + id), entering);
    countUps($('sc-' + id));
  }

  function safe(fn) {
    try { fn(); } catch (e) { if (window.console) console.error(e); }
  }

  function countUps(root) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-count]'), function (el) {
      var k = el.getAttribute('data-key'), to = Number(el.getAttribute('data-count'));
      var from = PREV[k] == null ? to : PREV[k];
      PREV[k] = to;
      if (from === to) { el.textContent = fmt(to); return; }
      var tile = el.closest('.tile');
      if (tile && to > from) { tile.classList.remove('bump'); void tile.offsetWidth; tile.classList.add('bump'); }
      var t0 = performance.now(), len = 1400;
      (function step(now) {
        var p = Math.min(1, (now - t0) / len), e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(Math.round(from + (to - from) * e));
        if (p < 1) requestAnimationFrame(step); else el.textContent = fmt(to);
      })(t0);
    });
  }

  /* ======================================================================
   *  MAIN — house totals + section/event matrix
   * ==================================================================== */
  function renderMain(el, entering) {
    var hs = D.houses;
    var noResults = awarded() === 0;
    // Tiles in ranking order: leader first (standings are already sorted, ties keep house order).
    var ranked = D.standings.map(function (s) { return house(s.house); });
    var tiles = ranked.map(function (h) {
      var s = standing(h.name);
      var lead = !noResults && s.rank === 1;
      var gap;
      if (noResults) gap = 'Awaiting results';
      else if (s.rank === 1) gap = D.race.lead > 0 ? 'Leading by ' + fmt(D.race.lead) : 'Tied for 1st';
      else gap = fmt(s.gapToLeader) + ' behind';
      return '<div class="tile' + (lead ? ' lead' : '') + '" style="' + hvars(h) + '">' +
        '<div class="t-top"><span class="t-rank">' + (noResults ? '—' : ord(s.rank)) + '</span><span class="t-name">' + esc(h.name) + '</span>' + (lead ? '<span class="t-crown">LEADING</span>' : '') + '</div>' +
        '<div class="t-pts" data-count="' + s.points + '" data-key="tile-' + esc(h.name) + '">' + fmt(s.points) + '</div>' +
        '<div class="t-bot"><span class="t-med">' + md(1) + s.first + md(2) + s.second + md(3) + s.third + '</span><span class="t-gap">' + esc(gap) + '</span></div>' +
      '</div>';
    }).join('');
    el.innerHTML = '<div class="m-totals rise" style="grid-template-columns:repeat(' + hs.length + ',1fr)">' + tiles + '</div>' +
      '<div class="m-board" id="mBoard"></div><div class="m-foot" id="mFoot"></div>';
    layoutMain(entering);
  }

  function layoutMain(entering) {
    var board = $('mBoard');
    if (!board) return;
    var hs = D.houses, r = rem();
    var W = board.clientWidth, H = board.clientHeight, gap = r;
    var cardMin = (10 + hs.length * 4.2) * r;
    var cols = Math.max(1, Math.min(4, Math.floor((W + gap) / (cardMin + gap))));
    var chrome = (1 + 2.4 + 1.9 + 2.2 + .6) * r;
    var rpc = Math.max(3, Math.floor((H - chrome) / (2.05 * r)));
    // Phones / portrait: one scrollable page, one full card per section.
    var narrow = window.matchMedia && window.matchMedia('(max-width: 820px), (max-aspect-ratio: 4/5)').matches;
    if (narrow) { rpc = Infinity; cols = W > 640 ? 2 : 1; }

    var cards = [];
    D.sections.forEach(function (sec) {
      var n = sec.events.length;
      if (!n) return;
      var parts = Math.max(1, Math.ceil(n / rpc)), per = Math.ceil(n / parts);
      for (var p = 0; p < parts; p++) {
        cards.push({ sec: sec, events: sec.events.slice(p * per, (p + 1) * per), part: p + 1, parts: parts });
      }
    });
    // If there is spare room, let fewer cards spread across the full width.
    if (cards.length && cards.length < cols) cols = cards.length;
    var pages = [];
    if (narrow) { if (cards.length) pages.push(cards); }
    else for (var i = 0; i < cards.length; i += cols) pages.push(cards.slice(i, i + cols));
    M.pages = pages; M.cols = cols;
    if (M.page >= pages.length) M.page = 0;
    board.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    drawPage(entering);
  }

  function drawPage(animate) {
    var board = $('mBoard');
    if (!board) return;
    if (!M.pages.length) {
      board.style.gridTemplateColumns = '1fr';
      board.innerHTML = '<div class="empty-big">WAITING FOR EVENTS<small>Events appear here once registrations or the event catalogue are available.</small></div>';
      $('mFoot').innerHTML = '';
      return;
    }
    var page = M.pages[M.page] || [];
    board.innerHTML = page.map(cardHtml).join('');
    if (animate) { board.classList.remove('fade'); void board.offsetWidth; board.classList.add('fade'); }
    $('mFoot').innerHTML = M.pages.length > 1 ? M.pages.map(function (_, i) { return '<i class="' + (i === M.page ? 'on' : '') + '"></i>'; }).join('') : '';
    var names = [];
    page.forEach(function (c) { if (names.indexOf(c.sec.name) < 0) names.push(c.sec.name); });
    $('sceneSub').textContent = names.join(' · ') + (M.pages.length > 1 ? '  ·  PAGE ' + (M.page + 1) + ' / ' + M.pages.length : '');
  }

  function cardHtml(c) {
    var hs = D.houses, sec = c.sec;
    var head = '<tr><th>EVENT</th>' + hs.map(function (h) { return '<th class="h"><span class="hh" style="--c:' + h.color + '">' + esc(h.name) + '</span></th>'; }).join('') + '</tr>';
    var rows = c.events.map(function (e) {
      if (!e.declared) {
        return '<tr class="pend"><td class="ev">' + esc(e.name) + '</td>' + hs.map(function () { return '<td class="c">·</td>'; }).join('') + '</tr>';
      }
      return '<tr><td class="ev">' + esc(e.name) + '</td>' + hs.map(function (h) {
        var p = e.points[h.name] || 0, pos = e.positions[h.name];
        var best = pos && pos.length ? Math.min.apply(null, pos) : 0;
        if (!p && !best) return '<td class="c z">—</td>';
        var st = best === 1 ? 'background:' + h.color + ';color:' + h.ink :
                 best === 2 ? 'background:' + rgba(h.color, .38) :
                 best === 3 ? 'background:' + rgba(h.color, .2) : '';
        return '<td class="c"><span style="' + st + '">' + fmt(p) + '</span></td>';
      }).join('') + '</tr>';
    }).join('');
    var tot = c.part === c.parts ?
      '<tr class="tot"><td class="ev">SECTION TOTAL</td>' + hs.map(function (h) { return '<td class="c">' + fmt(sec.totals[h.name] || 0) + '</td>'; }).join('') + '</tr>' : '';
    var colg = '<colgroup><col>' + hs.map(function () { return '<col style="width:4.2rem">'; }).join('') + '</colgroup>';
    return '<div class="panel mcard">' +
      '<div class="mc-h"><span class="mc-name">' + esc(sec.name) + '</span>' + (c.parts > 1 ? '<span class="mc-part">' + c.part + '/' + c.parts + '</span>' : '') +
      '<span class="mc-prog">' + sec.declared + ' / ' + sec.total + ' DECLARED</span></div>' +
      '<table class="mx">' + colg + '<thead>' + head + '</thead><tbody>' + rows + tot + '</tbody></table></div>';
  }

  /* ======================================================================
   *  LATEST RESULT
   * ==================================================================== */
  function renderLatest(el) {
    var L = D.latest;
    if (!L) { el.innerHTML = '<div class="empty-big">NO RESULTS YET</div>'; return; }
    var byPos = {};
    L.entries.forEach(function (e) { (byPos[e.position] = byPos[e.position] || []).push(e); });
    var slot = function (p) {
      var list = byPos[p] || [];
      return '<div class="pod p' + p + ' rise" style="animation-delay:' + ({ 1: .35, 2: .15, 3: .55 }[p]) + 's">' +
        (list.length ? list.map(function (e) {
          var h = house(e.house);
          return '<div class="pod-h" style="' + hvars(h) + '"><b>' + esc(h.name) + '</b><span>+' + fmt(e.points) + '</span></div>';
        }).join('') : '<div class="pod-none">—</div>') +
        '<div class="pod-base">' + ord(p) + '</div></div>';
    };
    var extra = L.entries.filter(function (e) { return e.position > 3; });
    var standings = D.standings.map(function (s) {
      var h = house(s.house);
      return '<div class="mini-row"><span class="r">' + s.rank + '</span><span class="bar" style="--c:' + h.color + '"></span><span class="n">' + esc(h.name) + '</span><span class="p num">' + fmt(s.points) + '</span></div>';
    }).join('');
    el.innerHTML = '<div class="lt">' +
      '<div class="panel lt-main"><span class="flash-banner">NEW RESULT</span>' +
        '<div class="lt-label rise">LATEST RESULT</div>' +
        '<div class="lt-title rise"><span>' + esc(L.section) + ' – </span>' + esc(L.event) + '</div>' +
        '<div class="lt-time rise">Declared at ' + hm(L.ts) + '</div>' +
        (extra.length ? '<div class="lt-extra rise">' + extra.map(ec).join('') + '</div>' : '') +
        '<div class="podium">' + slot(2) + slot(1) + slot(3) + '</div>' +
      '</div>' +
      '<div class="panel mini rise"><div class="ptitle">Standings now</div>' + standings + '</div>' +
    '</div>';
    $('sceneSub').textContent = L.section + ' · ' + L.event;
  }

  /* ======================================================================
   *  RECENT RESULTS
   * ==================================================================== */
  function renderRecent(el) {
    var list = (D.recent || []).slice(0, 10);
    el.innerHTML = '<div class="rc">' + list.map(function (r, i) {
      return '<div class="panel rc-row rise' + (i === 0 ? ' first' : '') + '" style="animation-delay:' + (i * .06) + 's">' +
        '<span class="rc-time">' + hm(r.ts) + '</span>' +
        '<span class="rc-ev"><span>' + esc(r.section) + '</span>' + esc(r.event) + '</span>' +
        '<span class="rc-ent">' + r.entries.map(ec).join('') + '</span></div>';
    }).join('') + '</div>';
    $('sceneSub').textContent = 'Most recent ' + list.length + ' declared events';
  }

  /* ======================================================================
   *  SECTION CHAMPIONSHIP
   * ==================================================================== */
  function renderSections(el) {
    var hs = D.houses;
    var rows = D.sections.map(function (sec, i) {
      var vals = hs.map(function (h) { return sec.totals[h.name] || 0; });
      var max = Math.max.apply(null, vals), sum = vals.reduce(function (a, b) { return a + b; }, 0);
      return '<tr class="rise" style="animation-delay:' + (i * .08) + 's"><td class="lab">' + esc(sec.name) + '<small>' + sec.declared + ' / ' + sec.total + ' events declared</small></td>' +
        hs.map(function (h, j) {
          var v = vals[j], top = max > 0 && v === max;
          return '<td><span class="cell" style="' + (top ? 'background:' + h.color + ';color:' + h.ink : '') + '">' + (v ? fmt(v) : '—') + '</span></td>';
        }).join('') +
        '<td><div class="stack">' + (sum ? hs.map(function (h, j) { return '<i style="--c:' + h.color + ';width:' + (vals[j] / sum * 100) + '%"></i>'; }).join('') : '') + '</div></td></tr>';
    }).join('');
    var totals = hs.map(function (h) { return standing(h.name).points; });
    var tmax = Math.max.apply(null, totals);
    el.innerHTML = '<div class="panel" style="flex:1;padding:.6rem 1rem;overflow:hidden"><table class="tbl"><thead><tr><th>Section</th>' +
      hs.map(function (h) { return '<th><span class="hth" style="--c:' + h.color + '">' + esc(h.name) + '</span></th>'; }).join('') + '<th>Share</th></tr></thead>' +
      '<tbody>' + rows + '</tbody><tfoot><tr><td class="lab">Overall</td>' +
      hs.map(function (h, j) { var top = tmax > 0 && totals[j] === tmax; return '<td><span class="cell" style="' + (top ? 'background:' + h.color + ';color:' + h.ink : '') + '">' + fmt(totals[j]) + '</span></td>'; }).join('') +
      '<td></td></tr></tfoot></table></div>';
    $('sceneSub').textContent = 'Points won in each section';
  }

  /* ======================================================================
   *  HOUSE PERFORMANCE
   * ==================================================================== */
  function renderPerformance(el) {
    var hs = D.houses, st = hs.map(function (h) { return standing(h.name); });
    var mx = function (f) { return Math.max(1, Math.max.apply(null, st.map(f))); };
    var m1 = mx(function (s) { return s.first; }), m2 = mx(function (s) { return s.second; }), m3 = mx(function (s) { return s.third; }), me = mx(function (s) { return s.eventsScored; });
    var total = awarded() || 1;
    var row = function (label, v, max, shown) {
      return '<div class="st-row"><span class="l">' + label + '</span><span class="track"><i style="width:' + (v / max * 100) + '%"></i></span><span class="v">' + (shown != null ? shown : v) + '</span></div>';
    };
    el.innerHTML = '<div class="perf" style="grid-template-columns:repeat(' + hs.length + ',1fr)">' + hs.map(function (h, i) {
      var s = st[i];
      return '<div class="panel pf rise" style="' + hvars(h) + ';animation-delay:' + (i * .1) + 's">' +
        '<div class="pf-h"><b>' + esc(h.name) + '</b><span>' + ord(s.rank) + '</span></div>' +
        '<div class="pf-pts" data-count="' + s.points + '" data-key="pf-' + esc(h.name) + '">' + fmt(s.points) + '</div><div style="padding:0 1.3rem;color:var(--muted);letter-spacing:.14em;font-size:.8rem;font-weight:700">TOTAL POINTS</div>' +
        '<div class="pf-stats">' +
          row('Event wins', s.first, m1) + row('2nd places', s.second, m2) + row('3rd places', s.third, m3) +
          row('Events scored', s.eventsScored, me) +
          row('Points share', s.points, total, Math.round(s.points / total * 100) + '%') +
        '</div></div>';
    }).join('') + '</div>';
    $('sceneSub').textContent = D.progress.declared + ' of ' + D.progress.total + ' events completed';
  }

  /* ======================================================================
   *  MEDAL / POSITION TABLE
   * ==================================================================== */
  function renderMedals(el) {
    var anyOther = D.standings.some(function (s) { return s.other > 0; });
    el.innerHTML = '<div class="panel" style="flex:1;padding:.8rem 1.2rem;overflow:hidden"><table class="tbl"><thead><tr><th>House</th>' +
      '<th>' + md(1) + ' 1st</th><th>' + md(2) + ' 2nd</th><th>' + md(3) + ' 3rd</th>' + (anyOther ? '<th>Other</th>' : '') + '<th>Points</th></tr></thead><tbody>' +
      D.standings.map(function (s, i) {
        var h = house(s.house);
        return '<tr class="rise" style="animation-delay:' + (i * .08) + 's"><td class="lab"><span style="display:inline-flex;align-items:center;gap:1rem"><span style="font-size:2.2rem;color:var(--muted);width:2.2rem">' + s.rank + '</span><span class="ec" style="' + hvars(h) + ';font-size:1.8rem;padding:.2rem 1rem">' + esc(h.name) + '</span></span></td>' +
          '<td style="font-size:2.8rem">' + s.first + '</td><td style="font-size:2.8rem">' + s.second + '</td><td style="font-size:2.8rem">' + s.third + '</td>' +
          (anyOther ? '<td style="color:var(--muted)">' + s.other + '</td>' : '') +
          '<td style="font-size:3.2rem;font-weight:800">' + fmt(s.points) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    $('sceneSub').textContent = 'Positions won by each house';
  }

  /* ======================================================================
   *  EVENT & SECTION PROGRESS
   * ==================================================================== */
  function renderProgress(el) {
    var P = D.progress, pct = P.total ? Math.round(P.declared / P.total * 100) : 0;
    var C = 2 * Math.PI * 44;
    el.innerHTML = '<div class="pg">' +
      '<div class="panel pg-left rise">' +
        '<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>' +
        '<circle cx="50" cy="50" r="44" fill="none" stroke="url(#pgGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - pct / 100)) + '" style="transition:stroke-dashoffset 1.2s"/>' +
        '<defs><linearGradient id="pgGrad"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs></svg>' +
        '<div class="in"><div class="pct">' + pct + '%</div><div class="lbl">COMPLETE</div></div></div>' +
        '<div class="kpis"><div class="kpi"><b>' + P.total + '</b><span>TOTAL EVENTS</span></div><div class="kpi"><b>' + P.declared + '</b><span>DECLARED</span></div><div class="kpi"><b>' + P.remaining + '</b><span>REMAINING</span></div></div>' +
      '</div>' +
      '<div class="panel pg-right">' + D.sections.map(function (s, i) {
        var p = s.total ? Math.round(s.declared / s.total * 100) : 0, done = s.total > 0 && s.declared >= s.total;
        return '<div class="sp-row rise' + (done ? ' done' : '') + '" style="animation-delay:' + (i * .08) + 's"><span class="n">' + esc(s.name) + '</span>' +
          '<span class="track"><i style="width:' + p + '%"></i></span>' +
          '<span class="v">' + s.declared + '/' + s.total + '<small>' + (done ? 'COMPLETE' : p + '%') + '</small></span></div>';
      }).join('') + '</div>' +
    '</div>';
    $('sceneSub').textContent = P.declared + ' of ' + P.total + ' events declared';
  }

  /* ======================================================================
   *  PARTICIPATION
   * ==================================================================== */
  function renderParticipation(el) {
    var P = D.participation;
    var hmax = Math.max.apply(null, [1].concat(P.byHouse.map(function (x) { return x.athletes; })));
    var smax = Math.max.apply(null, [1].concat(P.bySection.map(function (x) { return x.athletes; })));
    var classes = P.byClass.slice(0, 14);
    var cmax = Math.max.apply(null, [1].concat(classes.map(function (x) { return x.athletes; })));
    el.innerHTML = '<div class="pt">' +
      '<div class="pt-kpis">' +
        '<div class="kpi rise"><b class="num" data-count="' + P.athletes + '" data-key="pa">' + P.athletes + '</b><span>REGISTERED ATHLETES</span></div>' +
        '<div class="kpi rise"><b class="num" data-count="' + P.entries + '" data-key="pe">' + P.entries + '</b><span>EVENT ENTRIES</span></div>' +
        '<div class="kpi rise"><b class="num">' + P.eventsOffered + '</b><span>EVENTS WITH ENTRIES</span></div>' +
        '<div class="kpi rise"><b class="num">' + fmt(P.avgEvents) + '</b><span>EVENTS PER ATHLETE</span></div>' +
      '</div>' +
      '<div class="pt-grid">' +
        '<div class="panel pt-card rise"><div class="ptitle">Athletes by house</div>' + P.byHouse.map(function (x) {
          var h = house(x.house);
          return '<div class="hb-row" style="--c:' + h.color + '"><span class="l">' + esc(h.name) + '</span><span class="track"><i style="width:' + (x.athletes / hmax * 100) + '%"></i></span><span class="v">' + x.athletes + '</span></div>';
        }).join('') +
        '<div class="ptitle" style="margin-top:.6rem">Athletes by section</div>' + P.bySection.map(function (x) {
          return '<div class="hb-row" style="--c:#818cf8"><span class="l">' + esc(x.name) + '</span><span class="track"><i style="width:' + (x.athletes / smax * 100) + '%"></i></span><span class="v">' + x.athletes + '</span></div>';
        }).join('') + '</div>' +
        '<div class="panel pt-card rise"><div class="ptitle">Athletes by class</div><div class="cols">' + classes.map(function (x) {
          return '<div class="col"><b>' + x.athletes + '</b><i style="height:' + (x.athletes / cmax * 100) + '%"></i><span>' + esc(x.name) + '</span></div>';
        }).join('') + '</div></div>' +
        '<div class="panel pt-card rise"><div class="ptitle">Most entered events</div>' + P.topEvents.map(function (x, i) {
          return '<div class="te-row"><span class="i">' + (i + 1) + '</span><span class="e"><span>' + esc(x.section) + '</span>' + esc(x.event) + '</span><span class="c">' + x.count + '</span></div>';
        }).join('') + '</div>' +
      '</div></div>';
    $('sceneSub').textContent = 'From the registration desk';
  }

  /* ======================================================================
   *  CHAMPIONSHIP RACE
   * ==================================================================== */
  function renderRace(el) {
    var S = D.standings, R = D.race;
    var lead = S.length ? S[0].points : 0;
    el.innerHTML = '<div class="race panel">' + S.map(function (s, i) {
      var h = house(s.house), w = lead > 0 ? Math.max(4, s.points / lead * 100) : 4;
      var gap = i === 0 ? (R.lead > 0 ? 'LEADS +' + fmt(R.lead) : 'TIED') : fmt(s.gapToLeader) + ' BEHIND';
      return '<div class="rr rise" style="animation-delay:' + (i * .12) + 's"><span class="rk">' + s.rank + '</span><span class="nm">' + esc(h.name) + '</span>' +
        '<span class="lane"><i style="' + hvars(h) + ';width:' + w + '%">' + fmt(s.points) + '</i></span>' +
        '<span class="gap' + (i === 0 ? ' lead' : '') + '">' + gap + '</span></div>';
    }).join('') +
    '<div class="race-kpis">' +
      '<div class="kpi"><b>' + fmt(R.awarded) + '</b><span>POINTS AWARDED</span></div>' +
      '<div class="kpi"><b>' + R.remainingEvents + '</b><span>EVENTS REMAINING</span></div>' +
      '<div class="kpi"><b>' + fmt(R.pointsRemaining) + '</b><span>POINTS STILL ON OFFER</span></div>' +
      '<div class="kpi"><b>' + fmt(R.lead) + '</b><span>CURRENT LEAD</span></div>' +
    '</div>' +
    '<div class="note-line">Points on offer = remaining events × ' + fmt(R.pointsPerEvent) + ' (' + D.meta.pointsScheme.join('/') + ' scheme). Standings are as of now, not a prediction.</div>' +
    '</div>';
    $('sceneSub').textContent = 'Points and gaps right now';
  }

  /* ======================================================================
   *  Ticker + footer progress
   * ==================================================================== */
  var tickerSig = '';
  function renderTicker() {
    var list = (D.recent || []).slice(0, 10);
    var sig = list.map(function (r) { return r.sig; }).join('|') + '#' + (D.houses || []).map(function (h) { return h.name; }).join();
    var P = D.progress, pct = P.total ? Math.round(P.declared / P.total * 100) : 0;
    $('tkProg').innerHTML = '<span><b>' + P.declared + '</b> / ' + P.total + ' EVENTS</span><span class="mini-track"><i style="width:' + pct + '%"></i></span>';
    if (sig === tickerSig) return;
    tickerSig = sig;
    var inner = $('tkInner');
    var items;
    if (list.length) {
      items = list.map(function (r) {
        return '<span class="tk-item"><b>' + esc(r.section) + ' • ' + esc(r.event) + '</b>' + r.entries.map(ec).join('') + '</span><span class="tk-sep">///</span>';
      }).join('');
    } else {
      items = '<span class="tk-item"><b>' + esc(D.meta.title) + '</b> Results will appear here as soon as they are declared.</span><span class="tk-sep">///</span>';
    }
    inner.innerHTML = items + items;       // doubled for a seamless loop
    inner.style.animation = 'none';
    void inner.offsetWidth;
    var w = inner.scrollWidth / 2;
    inner.style.animation = 'tick ' + Math.max(20, w / CFG.TICKER_PX_PER_S) + 's linear infinite';
  }

  /* ======================================================================
   *  Housekeeping
   * ==================================================================== */
  function tickClock() {
    $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    updateStatus();
  }
  setInterval(tickClock, 1000);
  tickClock();

  // Web fonts change tile heights — re-measure the scoreboard once they arrive.
  try { document.fonts.ready.then(function () { if (cur === 'main' && D) safe(function () { layoutMain(false); }); }); } catch (e) {}

  var resizeT = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () { if (cur === 'main' && D) safe(function () { layoutMain(false); }); }, 250);
  });

  // Hide the mouse pointer when idle (TV / projector).
  var idleT = 0;
  document.addEventListener('mousemove', function () {
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  });

  // Optional operator keys: → next, ← main, P pause, F fullscreen.
  document.addEventListener('keydown', function (e) {
    if (!D) return;
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') { rot = -1; next(); }
    else if (e.key === 'p' || e.key === 'P') { paused = !paused; if (paused) { clearTimeout(T.scene); T.deadline = 0; } else next(); }
    else if (e.key === 'f' || e.key === 'F') {
      try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (x) {}
    }
  });
  // Tap (phone) or click (desktop) → next screen. A double-click toggles full
  // screen instead, so a single click waits briefly to rule out a second one.
  var tapT = 0;
  document.addEventListener('click', function () {
    if (!D) return;
    clearTimeout(tapT);
    tapT = setTimeout(function () { tapHint(); next(); }, 280);
  });
  document.addEventListener('dblclick', function () {
    clearTimeout(tapT);
    try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (x) {}
  });
  function tapHint() {
    var bar = $('timerBar');
    bar.classList.remove('skip'); void bar.offsetWidth; bar.classList.add('skip');
  }

  // Safety net: if the rotation timer ever dies, restart it.
  setInterval(function () {
    if (D && !paused && T.deadline && Date.now() > T.deadline + 15000) next();
  }, 20000);

  /* ======================================================================
   *  Boot: show cached data instantly, then go live.
   * ==================================================================== */
  try {
    var cached = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (cached && cached.houses) onData(cached, true);
  } catch (e) {}
  poll();
})();
</script>
</body>
</html>
